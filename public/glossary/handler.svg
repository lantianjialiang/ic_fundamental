<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Handler">
  <rect width="800" height="480" fill="#14181d"/>
  <text x="28" y="36" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="16">Handler · IC handler</text>
  <text x="28" y="56" fill="#6e7681" font-family="Segoe UI, sans-serif" font-size="12">Moves devices. ATE measures. Handler sorts by Bin.</text>
  <rect x="40" y="120" width="130" height="160" rx="4" fill="#2a3038" stroke="#3d444d"/>
  <text x="105" y="144" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="12">Input Tray</text>
  <g fill="#1c2128" stroke="#6e7681">
    <rect x="58" y="158" width="28" height="20" rx="2"/><rect x="92" y="158" width="28" height="20" rx="2"/><rect x="126" y="158" width="28" height="20" rx="2"/>
    <rect x="58" y="186" width="28" height="20" rx="2"/><rect x="92" y="186" width="28" height="20" rx="2"/><rect x="126" y="186" width="28" height="20" rx="2"/>
    <rect x="58" y="214" width="28" height="20" rx="2"/><rect x="92" y="214" width="28" height="20" rx="2"/><rect x="126" y="214" width="28" height="20" rx="2"/>
  </g>
  <text x="105" y="262" text-anchor="middle" fill="#d8dee6" font-family="Segoe UI, sans-serif" font-size="11">untested DUT</text>
  <path d="M170 200 H220" stroke="#e8c45a" stroke-width="2"/>
  <text x="195" y="190" text-anchor="middle" fill="#e8c45a" font-family="Segoe UI, sans-serif" font-size="11">load</text>
  <rect x="220" y="100" width="240" height="280" rx="6" fill="#3a414a" stroke="#2f343b"/>
  <text x="340" y="124" text-anchor="middle" fill="#d8dee6" font-family="Segoe UI, sans-serif" font-size="13">Handler</text>
  <rect x="250" y="148" width="180" height="16" rx="2" fill="#5a616a"/>
  <rect x="330" y="148" width="20" height="70" fill="#8b949e"/>
  <rect x="318" y="214" width="44" height="20" rx="2" fill="#6e7681"/>
  <text x="340" y="196" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11">Pick and Place</text>
  <rect x="286" y="250" width="108" height="70" rx="4" fill="#2f6b3a"/>
  <rect x="308" y="264" width="64" height="28" rx="2" fill="#2a2e34"/>
  <rect x="322" y="270" width="36" height="16" rx="2" fill="#111" stroke="#e8c45a"/>
  <text x="340" y="338" text-anchor="middle" fill="#d8dee6" font-family="Segoe UI, sans-serif" font-size="11">Socket / Test Site</text>
  <path d="M460 200 H510" stroke="#e8c45a" stroke-width="2"/>
  <text x="485" y="190" text-anchor="middle" fill="#e8c45a" font-family="Segoe UI, sans-serif" font-size="11">sort</text>
  <g font-family="Segoe UI, sans-serif" font-size="12">
    <rect x="510" y="120" width="110" height="70" rx="4" fill="#1f3d2a" stroke="#3fb950"/>
    <text x="565" y="150" text-anchor="middle" fill="#3fb950">Bin 1</text>
    <text x="565" y="170" text-anchor="middle" fill="#9be9a8">PASS</text>
    <rect x="510" y="202" width="110" height="70" rx="4" fill="#3d2222" stroke="#f85149"/>
    <text x="565" y="232" text-anchor="middle" fill="#f85149">Bin 2</text>
    <text x="565" y="252" text-anchor="middle" fill="#ffb1af">FUNC FAIL</text>
    <rect x="510" y="284" width="110" height="70" rx="4" fill="#3d3018" stroke="#e8c45a"/>
    <text x="565" y="314" text-anchor="middle" fill="#e8c45a">Bin 6</text>
    <text x="565" y="334" text-anchor="middle" fill="#e8c45a">DC FAIL</text>
  </g>
  <text x="40" y="430" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="12">Handler does not judge Pass/Fail. It only moves parts to the tray that matches the Bin from ATE.</text>
</svg>
