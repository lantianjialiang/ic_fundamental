  <circle cx="94" cy="404" r="8" fill="#1a1f24"/>
  <circle cx="566" cy="404" r="8" fill="#1a1f24"/>
  <rect x="86" y="150" width="36" height="180" rx="3" fill="#2a2e34"/>
