  <text x="104" y="348" text-anchor="middle" fill="#e8c45a" font-family="Segoe UI, sans-serif" font-size="11">connector</text>
  <g stroke="#c9a24a" stroke-width="2" fill="none">
    <path d="M122 166 H220 V240 H300"/>
    <path d="M122 180 H200 V300 H300"/>
