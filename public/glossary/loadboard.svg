  <text x="620" y="240" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="12">board with a</text>
  <text x="620" y="260" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="12">circular Probe Card.</text>
