<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="ATE">
  <rect width="800" height="480" fill="#14181d"/>
  <text x="28" y="36" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="16">ATE · Automatic Test Equipment</text>
  <text x="28" y="56" fill="#6e7681" font-family="Segoe UI, sans-serif" font-size="12">Cabinet + test head. Not an oscilloscope. DUT does not plug into the cabinet.</text>
  <rect x="48" y="88" width="220" height="340" rx="6" fill="#4e555e" stroke="#2f343b"/>
  <rect x="62" y="108" width="192" height="36" rx="3" fill="#2a3038"/>
  <text x="158" y="132" text-anchor="middle" fill="#9be9a8" font-family="Segoe UI, sans-serif" font-size="14">ATE / Tester</text>
  <g font-family="Segoe UI, sans-serif" font-size="13" fill="#d8dee6">
    <rect x="62" y="160" width="192" height="44" fill="#3a414a"/>
    <text x="78" y="187">PE · Pin Electronics</text>
    <rect x="62" y="210" width="192" height="44" fill="#3a414a"/>
    <text x="78" y="237">PMU · source / measure</text>
    <rect x="62" y="260" width="192" height="44" fill="#3a414a"/>
    <text x="78" y="287">DPS · device power</text>
    <rect x="62" y="310" width="192" height="44" fill="#3a414a"/>
    <text x="78" y="337">Timing / controller</text>
  </g>
  <circle cx="86" cy="392" r="6" fill="#3fb950"/>
  <circle cx="108" cy="392" r="6" fill="#e8c45a"/>
  <path d="M268 200 H320" stroke="#c9a24a" stroke-width="8" stroke-linecap="round"/>
  <rect x="320" y="128" width="200" height="150" rx="5" fill="#5a616a" stroke="#2f343b"/>
  <text x="420" y="156" text-anchor="middle" fill="#e8c45a" font-family="Segoe UI, sans-serif" font-size="14">Test Head</text>
  <text x="420" y="176" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11">Channel pogo interface</text>
  <g fill="#c9a24a">
    <circle cx="356" cy="208" r="5"/><circle cx="380" cy="208" r="5"/><circle cx="404" cy="208" r="5"/><circle cx="428" cy="208" r="5"/><circle cx="452" cy="208" r="5"/><circle cx="476" cy="208" r="5"/>
    <circle cx="356" cy="232" r="5"/><circle cx="380" cy="232" r="5"/><circle cx="404" cy="232" r="5"/><circle cx="428" cy="232" r="5"/><circle cx="452" cy="232" r="5"/><circle cx="476" cy="232" r="5"/>
  </g>
  <rect x="340" y="288" width="160" height="22" rx="2" fill="#2f6b3a" stroke="#1e4626"/>
  <text x="420" y="304" text-anchor="middle" fill="#d8dee6" font-family="Segoe UI, sans-serif" font-size="11">Load Board</text>
  <rect x="386" y="312" width="68" height="18" rx="2" fill="#2a2e34"/>
  <text x="420" y="325" text-anchor="middle" fill="#d8dee6" font-family="Segoe UI, sans-serif" font-size="10">Socket</text>
  <rect x="400" y="332" width="40" height="14" rx="2" fill="#1c2128" stroke="#8b949e"/>
  <text x="420" y="343" text-anchor="middle" fill="#e8c45a" font-family="Segoe UI, sans-serif" font-size="9">DUT</text>
  <text x="560" y="200" fill="#d8dee6" font-family="Segoe UI, sans-serif" font-size="14">Runs Test Program.</text>
  <text x="560" y="224" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="13">Measures and bins DUT.</text>
  <text x="560" y="260" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="13">Path: Test Head</text>
  <text x="560" y="280" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="13">→ Load Board → Socket</text>
  <text x="560" y="300" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="13">→ DUT</text>
</svg>
